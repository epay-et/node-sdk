name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required for npm provenance, which attests that these artifacts were
      # built by this workflow from this commit. Needs a public repository.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build, type-check and test
        run: |
          pnpm build
          pnpm check-types
          pnpm test

      # A tag that disagrees with package.json would publish the wrong version
      # under the right tag, which is not something you can undo on npm.
      - name: Verify the tag matches both package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in node nestjs; do
            VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$VERSION" != "$TAG" ]; then
              echo "::error::packages/$pkg is $VERSION but the tag is $TAG"
              exit 1
            fi
          done
          echo "Both packages are at $TAG"

      # npm answers an unauthorised publish with 404 rather than 403, so a
      # missing token and a token without scope access look identical at the
      # point of failure. Separate them here, before anything is uploaded.
      - name: Verify npm credentials and scope access
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::The NPM_TOKEN secret is empty or not visible to this job."
            echo "Add it under Settings -> Secrets and variables -> Actions, or as an"
            echo "environment secret on the 'release' environment."
            exit 1
          fi
          echo "Token length: ${#NODE_AUTH_TOKEN} characters"

          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::npm rejected the token: ${WHO}"
            echo "The token is invalid, revoked, expired, or restricted by an IP allow-list."
            exit 1
          fi
          echo "Authenticated as: ${WHO}"

          echo "Organisations this token can see:"
          npm org ls e-pay 2>&1 || {
            echo "::error::This token cannot read the 'e-pay' organisation."
            echo "Regenerate it as a Granular Access Token with:"
            echo "  - Packages and scopes: Read and write"
            echo "  - Scope selection: the @e-pay scope (not 'only select packages',"
            echo "    which cannot cover a package that does not exist yet)"
            echo "  - Allowed IP ranges: empty, since runners have dynamic addresses"
            exit 1
          }

      # @e-pay/nestjs depends on @e-pay/node, so the core must land first.
      - name: Publish @e-pay/node
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance
        working-directory: packages/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @e-pay/nestjs
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance
        working-directory: packages/nestjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: |
          (cd packages/node && npm publish --access public --dry-run)
          (cd packages/nestjs && npm publish --access public --dry-run)
