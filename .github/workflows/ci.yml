name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The toolchain and the published packages have different Node floors, and
# conflating them breaks the build:
#
#   * pnpm 11 imports node:sqlite, so it needs Node >= 22.13 to even start.
#   * The suites are TypeScript run directly by `node --test`, which needs the
#     type-stripping loader (Node >= 22.6).
#   * The published packages support Node >= 18.
#
# So every job that touches pnpm runs on modern Node, and the >= 18 claim is
# proven separately by installing the packed tarball on each supported runtime.
jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check-types
      - run: pnpm test

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The VERSION constant rides in the User-Agent, so it must not drift from
      # the manifest npm actually publishes.
      - name: package.json matches src/version.ts
        run: |
          MANIFEST=$(node -p "require('./packages/node/package.json').version")
          CONSTANT=$(node -p "
            require('fs').readFileSync('packages/node/src/version.ts','utf8')
              .match(/VERSION\s*=\s*[\x27\x22]([^\x27\x22]+)/)[1]
          ")
          echo "manifest=$MANIFEST constant=$CONSTANT"
          [ "$MANIFEST" = "$CONSTANT" ] || {
            echo "::error::packages/node/src/version.ts says $CONSTANT but package.json says $MANIFEST"
            exit 1
          }
          NEST=$(node -p "require('./packages/nestjs/package.json').version")
          [ "$NEST" = "$MANIFEST" ] || {
            echo "::error::@e-pay/nestjs is $NEST but @e-pay/node is $MANIFEST; they release together"
            exit 1
          }

  lint:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  build:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack both packages
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          pnpm --filter @e-pay/node exec npm pack --pack-destination "$RUNNER_TEMP/tarballs"
          pnpm --filter @e-pay/nestjs exec npm pack --pack-destination "$RUNNER_TEMP/tarballs"
          ls -l "$RUNNER_TEMP/tarballs"

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          retention-days: 7

  # Proves the `engines: >=18` claim against the real tarball, on a runtime that
  # never sees pnpm or the repo's devDependencies.
  compat:
    name: Consume on Node ${{ matrix.node }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: tarballs

      - name: Install @e-pay/node into a clean project
        run: |
          mkdir -p consumer && cd consumer
          npm init -y > /dev/null
          npm install ../tarballs/e-pay-node-*.tgz > /dev/null

      - name: CommonJS require
        working-directory: consumer
        run: |
          node -e "
            const { Epay, formatAmount, normalizePhone } = require('@e-pay/node');
            const c = new Epay({ apiKey: 'sk_test_x0123456789' });
            if (c.mode !== 'sandbox') throw new Error('mode: ' + c.mode);
            if (formatAmount('250.5') !== '250.50') throw new Error('formatAmount');
            if (normalizePhone('0911234567') !== '+251911234567') throw new Error('normalizePhone');
            console.log('CJS ok on Node ' + process.versions.node);
          "

      - name: ESM import
        working-directory: consumer
        run: |
          node --input-type=module -e "
            import { Epay, signWebhookPayload, constructWebhookEvent } from '@e-pay/node';
            const c = new Epay({ apiKey: 'sk_test_x0123456789' });
            if (c.mode !== 'sandbox') throw new Error('mode: ' + c.mode);

            const body = JSON.stringify({ event: 'payment.success', reference: 'PAB1' });
            const sig = 'sha256=' + signWebhookPayload(body, 'secret');
            if (constructWebhookEvent(body, sig, 'secret').reference !== 'PAB1') {
              throw new Error('webhook round trip failed');
            }
            console.log('ESM ok on Node ' + process.versions.node);
          "

      - name: Subpath exports
        working-directory: consumer
        run: |
          node -e "
            const express = require('@e-pay/node/express');
            const fetchMw = require('@e-pay/node/fetch');
            require('@e-pay/node/webhooks/web');
            if (typeof express.expressEpayWebhook !== 'function') throw new Error('express subpath');
            if (typeof fetchMw.createEpayWebhookHandler !== 'function') throw new Error('fetch subpath');
            console.log('subpath exports ok on Node ' + process.versions.node);
          "

      # A retried initialize must reuse one idempotency key. On Node 18 the
      # global WebCrypto is not exposed, so this also exercises the fallback
      # key generator rather than crashing.
      - name: Live request path against a stub server
        working-directory: consumer
        run: |
          node -e "
            const http = require('http');
            const { Epay } = require('@e-pay/node');
            const seen = [];
            const server = http.createServer((req, res) => {
              seen.push(req.headers['x-idempotency-key']);
              if (seen.length === 1) { res.writeHead(429, { 'retry-after': '0' }); return res.end('{}'); }
              res.writeHead(200, { 'content-type': 'application/json' });
              res.end(JSON.stringify({ reference: 'PAB1', checkoutUrl: 'https://c/1', status: 'success', expiresAt: 'z' }));
            });
            server.listen(0, async () => {
              const epay = new Epay({ apiKey: 'sk_test_x0123456789', baseUrl: 'http://127.0.0.1:' + server.address().port, maxRetries: 2 });
              const s = await epay.payments.initialize({ amount: 250, currencyCode: 'etb', customerPhone: '0911234567' });
              if (s.reference !== 'PAB1') throw new Error('bad response');
              if (seen.length !== 2) throw new Error('expected one retry, got ' + seen.length);
              if (!seen[0] || seen[0] !== seen[1]) throw new Error('retry changed the idempotency key');
              console.log('retry + idempotency ok on Node ' + process.versions.node);
              server.close();
            });
          "
